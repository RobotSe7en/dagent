[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dagent-ai"
version = "0.8.1"
description = "Human-reviewed Agent DAG framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/RobotSe7en/dagent"
Documentation = "https://github.com/RobotSe7en/dagent/tree/main/docs"
Repository = "https://github.com/RobotSe7en/dagent"
Issues = "https://github.com/RobotSe7en/dagent/issues"

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "httpx[socks]>=0.28.1",
    "pytest-asyncio>=0.23",
    "pytest>=8.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]
mcp = [
    "mcp>=1.27.1,<2",
]
sandbox = [
    "docker>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["dagent*"]

[tool.setuptools.package-data]
dagent = ["resources/profiles/*.md", "resources/skills/*/SKILL.md"]
